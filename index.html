        /* Facility Gallery Animation */
        .gallery img {
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gallery img.visible {
            opacity: 1;
            transform: scale(1);
        }
        .gallery img:hover {

        /* FAQ Accordion */
        .faq-item {

        }

            background: #f8f9fa;

            display: flex;

            align-items: center;
        }
        .faq-question:hover { background: #f0f0f0; }
        .faq-answer {

            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);

    <script>
        // Facility Gallery Animation
        function animateGallery() {
            const images = document.querySelectorAll('.gallery img');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.15 });
            images.forEach(img => observer.observe(img));
        }

        // Interactive FAQ Accordion
        document.querySelectorAll('.faq-question').forEach(question => {
            question.addEventListener('click', () => {
                const answer = question.nextElementSibling;
                const icon = question.querySelector('.toggle-icon');
                
                document.querySelectorAll('.faq-answer').forEach(ans => {
                    if (ans !== answer) {
                        ans.classList.remove('show');
                        ans.previousElementSibling.querySelector('.toggle-icon').textContent = '+';
                    }
                });
                
                answer.classList.toggle('show');
                icon.textContent = answer.classList.contains('show') ? '−' : '+';
            });
        });

        // Initialize animations
        window.addEventListener('load', animateGallery);
    </script>
